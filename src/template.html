<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyPulse | Weather Forecast</title>
</head>
<body>
  <div class="map-bg"></div>

  <div id="app" class="initial-state">
    <header class="header-container">
      <h1 class="app-title"><span class="highlight">Sky</span>Pulse</h1>
      
      <form id="search-form" class="search-form">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search location (e.g. Lahore, PK)..." 
          required 
          autocomplete="off"
        />
        <button type="submit" id="search-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </form>
    </header>

    <main id="weather-dashboard" class="dashboard hidden">

    </main>


    <div id="loading-spinner" class="loading-overlay hidden">
      <div class="spinner"></div>
      <p>Fetching weather forecast...</p>
    </div>
  </div>
</body>
</html>
