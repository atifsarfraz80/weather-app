<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyPulse | Weather Forecast</title>
</head>
<body>
  <div class="map-bg"></div>

  <div id="app" class="initial-state">
    <header class="header-container">
      <h1 class="app-title"><span class="highlight">Sky</span>Pulse</h1>
      
      <form id="search-form" class="search-form">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search location (e.g. Lahore, PK)..." 
          required 
          autocomplete="off"
        />
        <button type="submit" id="search-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </form>
    </header>

    <main id="weather-dashboard" class="dashboard hidden">
      
      
      <section class="location-bar">
        <div class="location-info">
          <span class="location-icon">📍</span>
          <h2 id="current-location">Lahore</h2>
          <button id="choose-area-btn" class="text-btn">Choose area</button>
        </div>

        <div class="unit-toggle">
          <button id="unit-c" class="toggle-btn active">°C</button>
          <span class="divider">|</span>
          <button id="unit-f" class="toggle-btn">°F</button>
        </div>
      </section>

      <section class="weather-hero">
        <div class="temp-summary">
          <img id="weather-icon" src="" alt="Weather condition icon" class="hero-icon" />
          <div class="hero-temp-group">
            <span id="current-temp" class="hero-temp">31</span>
            <span class="unit-symbol">°C</span>
          </div>
          <div class="hero-details">
            <p>Precipitation: <span id="precipitation">70%</span></p>
            <p>Humidity: <span id="humidity">78%</span></p>
            <p>Wind: <span id="wind-speed">13 km/h</span></p>
          </div>
        </div>

        <div class="condition-summary">
          <h3 id="app-name-tag">Weather</h3>
          <p id="current-day">Friday</p>
          <p id="weather-condition" class="condition-text">Heavy thunderstorm</p>
        </div>
      </section>


      <section class="forecast-section">
        <div class="tab-menu">
          <button class="tab-btn active" data-tab="temp">Temperature</button>
          <button class="tab-btn" data-tab="precip">Precipitation</button>
          <button class="tab-btn" data-tab="wind">Wind</button>
        </div>

        <div id="forecast-cards" class="forecast-grid">
          <!-- Sample Card Structure for JS injection -->
           <!--
          <div class="forecast-card active">
            <span class="card-day">Fri</span>
            <img src="..." alt="icon" />
            <div class="card-temps">
              <span class="max-temp">31°</span>
              <span class="min-temp">28°</span>
            </div>
          </div>
          -->
           
        </div>
      </section>


      <section id="alert-banner" class="alert-card hidden">
        <h3 id="alert-title" class="alert-heading">Excessive Heat</h3>
        <p id="alert-location" class="alert-sub">Lahore</p>
        <p id="alert-description" class="alert-body">Severe heat is expected in this area.</p>
      </section>

    </main>


    <div id="loading-spinner" class="loading-overlay hidden">
      <div class="spinner"></div>
      <p>Fetching weather forecast...</p>
    </div>
  </div>
</body>
</html>
